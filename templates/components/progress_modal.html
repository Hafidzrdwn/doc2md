<!-- Global High-Visibility Processing & Download Progress Modal -->
<div id="globalProgressModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md hidden transition-all duration-300">
    <div class="relative w-full max-w-lg bg-slate-900/95 border border-slate-800 shadow-2xl rounded-2xl p-6 flex flex-col gap-5 overflow-hidden text-slate-100">
        
        <!-- Ambient Background Glow -->
        <div class="absolute -top-16 -right-16 w-36 h-36 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-16 -left-16 w-36 h-36 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Modal Header -->
        <div class="flex items-start gap-4">
            <div id="progressModalIconContainer" class="w-12 h-12 rounded-xl bg-sky-500/10 border border-sky-500/20 flex items-center justify-center text-sky-400 flex-shrink-0 relative mt-0.5">
                <svg id="progressModalSpinner" class="animate-spin w-6 h-6 text-sky-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
                <div id="progressModalSuccessIcon" class="hidden text-emerald-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
            </div>

            <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between gap-2 mb-1">
                    <h3 id="progressModalTitle" class="text-base font-bold text-slate-100 break-words leading-snug">
                        Memproses Permintaan...
                    </h3>
                    <span id="progressModalBadge" class="px-2 py-0.5 rounded-full text-[10px] font-mono font-semibold uppercase bg-sky-500/15 text-sky-300 border border-sky-500/30 shrink-0">
                        PROSES
                    </span>
                </div>
                <p id="progressModalSubtitle" class="text-xs text-slate-400 leading-relaxed break-words">
                    Menyiapkan naskah dan aset rendering...
                </p>
            </div>
        </div>

        <!-- Progress Metrics & Bar -->
        <div class="flex flex-col gap-2.5 bg-slate-950/60 border border-slate-800/80 rounded-xl p-3.5">
            <div class="flex items-start justify-between gap-3 text-xs">
                <div id="progressModalStepText" class="text-slate-300 font-medium flex items-start gap-2 min-w-0 flex-1 break-words leading-relaxed">
                    <span class="inline-block w-2 h-2 rounded-full bg-sky-400 animate-ping shrink-0 mt-1.5"></span>
                    <span class="break-words">Menghubungkan ke engine...</span>
                </div>
                <div class="flex items-baseline gap-1 font-mono shrink-0 ml-1">
                    <span id="progressModalPercentText" class="text-lg font-bold text-sky-400">0%</span>
                </div>
            </div>

            <!-- Dynamic Track -->
            <div class="w-full h-3.5 bg-slate-800 rounded-full overflow-hidden p-0.5 border border-slate-700/60 relative">
                <div id="progressModalBar" class="h-full bg-gradient-to-r from-sky-500 via-indigo-500 to-emerald-400 rounded-full transition-all duration-300 ease-out relative w-0">
                    <div class="absolute inset-0 progress-shimmer rounded-full"></div>
                </div>
            </div>
        </div>

        <!-- Itemized Progress Checklist (Visible for Batch Tasks) -->
        <div id="progressModalItemSection" class="hidden flex flex-col gap-1.5">
            <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                Daftar Berkas Antrean
            </span>
            <div id="progressModalItemList" class="max-h-48 overflow-y-auto space-y-2 pr-1 text-xs">
                <!-- Dynamically populated per item with natural wrapping -->
            </div>
        </div>

        <!-- Reassurance Footer Note -->
        <div class="flex items-start justify-between gap-2 text-[11px] text-slate-400 border-t border-slate-800/80 pt-3">
            <div id="progressModalFooterTip" class="flex items-start gap-1.5 min-w-0 flex-1 break-words leading-relaxed">
                <span class="shrink-0 mt-0.5">⚡</span>
                <span class="break-words">Engine headless Chromium & KaTeX sedang memproses dokumen offline.</span>
            </div>
            <span id="progressModalTimer" class="font-mono text-slate-400 shrink-0 ml-2 mt-0.5">00:00</span>
        </div>
    </div>
</div>
