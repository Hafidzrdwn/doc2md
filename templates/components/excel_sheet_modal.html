<!-- Excel Sheet Selector Modal -->
<div id="excelSheetModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md hidden transition-all duration-300">
    <div class="relative w-full max-w-lg bg-slate-900/95 border border-slate-800 shadow-2xl rounded-2xl p-6 flex flex-col gap-5 overflow-hidden text-slate-100">
        
        <!-- Ambient Background Glow -->
        <div class="absolute -top-16 -right-16 w-36 h-36 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-16 -left-16 w-36 h-36 bg-teal-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Modal Header -->
        <div class="flex items-start gap-4">
            <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 flex-shrink-0 mt-0.5">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
            </div>

            <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between gap-2 mb-1">
                    <h3 class="text-base font-bold text-slate-100 break-words leading-snug">
                        Pilih Sheet Excel
                    </h3>
                    <span id="excelSheetCountBadge" class="px-2 py-0.5 rounded-full text-[10px] font-mono font-semibold uppercase bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 shrink-0">
                        0 Sheet
                    </span>
                </div>
                <p id="excelModalSubtitle" class="text-xs text-slate-400 leading-relaxed break-words">
                    Pilih sheet tertentu atau konversi seluruh lembar kerja ke Markdown.
                </p>
                <div id="excelFileNameBadge" class="mt-1.5 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-slate-950 border border-slate-800 text-[11px] font-mono text-emerald-400 max-w-full truncate">
                    <span class="truncate" id="excelModalFileName">dokumen.xlsx</span>
                </div>
            </div>
        </div>

        <!-- Selection Quick Bar -->
        <div class="flex items-center justify-between text-xs pt-1 pb-1 border-b border-slate-800/80">
            <label class="flex items-center gap-2 cursor-pointer select-none text-slate-300 hover:text-white">
                <input type="checkbox" id="excelSelectAllCheckbox" class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-emerald-600 focus:ring-emerald-500 focus:ring-offset-slate-900 cursor-pointer" checked>
                <span class="font-medium">Pilih Semua Sheet (All)</span>
            </label>
            <span id="excelSelectedCountText" class="text-[11px] font-mono text-slate-400">
                Semua sheet dipilih
            </span>
        </div>

        <!-- Sheet Checklist Container -->
        <div id="excelSheetList" class="flex flex-col gap-2 max-h-60 overflow-y-auto pr-1 scrollbar-thin">
            <!-- Sheet items populated dynamically via JS -->
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-800/80">
            <button type="button" id="excelSheetCancelBtn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-xl text-xs font-semibold transition">
                Batal
            </button>
            <button type="button" id="excelSheetConvertBtn" class="px-4 py-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-xl text-xs font-semibold shadow-lg shadow-emerald-950/40 transition flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                <span>Konversi ke Markdown</span>
            </button>
        </div>

    </div>
</div>
